{{- if and .Values.backup .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "iraven-admin.fullname" . }}-db-backup
  labels:
    {{- include "iraven-admin.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: db-backup
              image: {{ .Values.backup.image }}
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  for DB in admin web; do
                    if [ -f "/data/${DB}.db" ]; then
                      KEY="db/${DB}-${TIMESTAMP}.db"
                      aws s3 cp "/data/${DB}.db" "s3://${S3_BUCKET}/${KEY}" \
                        --endpoint-url "${S3_ENDPOINT}" \
                        --region "${S3_REGION}"
                      # Keep a fixed "latest" pointer for restore
                      aws s3 cp "/data/${DB}.db" "s3://${S3_BUCKET}/db/${DB}-latest.db" \
                        --endpoint-url "${S3_ENDPOINT}" \
                        --region "${S3_REGION}"
                      echo "Backed up ${DB}.db → ${KEY}"
                    else
                      echo "Skipping ${DB}.db — not found"
                    fi
                  done
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "iraven-admin.fullname" . }}
                      key: S3_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "iraven-admin.fullname" . }}
                      key: S3_SECRET_ACCESS_KEY
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "iraven-admin.fullname" . }}
                      key: S3_ENDPOINT
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "iraven-admin.fullname" . }}
                      key: S3_BUCKET
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "iraven-admin.fullname" . }}
                      key: S3_REGION
              volumeMounts:
                - name: db-data
                  mountPath: /data
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: db-data
              persistentVolumeClaim:
                claimName: {{ include "iraven-admin.fullname" . }}-db
{{- end }}
