apiVersion: v1
kind: Service
metadata:
  name: {{ include "iraven-admin.fullname" . }}
  labels:
    {{- include "iraven-admin.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "iraven-admin.selectorLabels" . | nindent 4 }}

{{- if eq .Values.app.strategy.type "blueGreen" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iraven-admin.fullname" . }}-preview
  labels:
    {{- include "iraven-admin.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "iraven-admin.selectorLabels" . | nindent 4 }}
{{- end }}
