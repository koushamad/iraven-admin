apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "iraven-admin.fullname" . }}-vault
  labels:
    {{- include "iraven-admin.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: {{ include "iraven-admin.fullname" . }}
    creationPolicy: Owner
  data:
    {{- if .Values.smtp.enabled }}
    - secretKey: SMTP_HOST
      remoteRef: { key: {{ .Values.smtp.secretPath | quote }}, property: host }
    - secretKey: SMTP_PORT
      remoteRef: { key: {{ .Values.smtp.secretPath | quote }}, property: port }
    - secretKey: SMTP_USER
      remoteRef: { key: {{ .Values.smtp.secretPath | quote }}, property: username }
    - secretKey: SMTP_PASS
      remoteRef: { key: {{ .Values.smtp.secretPath | quote }}, property: password }
    {{- end }}
    {{- if .Values.session.enabled }}
    - secretKey: SESSION_PASSWORD
      remoteRef: { key: {{ .Values.session.secretPath | quote }}, property: password }
    {{- end }}
    {{- if .Values.s3.enabled }}
    - secretKey: S3_ENDPOINT
      remoteRef: { key: {{ .Values.s3.secretPath | quote }}, property: endpoint }
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef: { key: {{ .Values.s3.secretPath | quote }}, property: access_key }
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef: { key: {{ .Values.s3.secretPath | quote }}, property: secret_key }
    - secretKey: S3_BUCKET
      remoteRef: { key: {{ .Values.s3.secretPath | quote }}, property: bucket }
    - secretKey: S3_REGION
      remoteRef: { key: {{ .Values.s3.secretPath | quote }}, property: region }
    {{- end }}
    {{- if .Values.internal.enabled }}
    - secretKey: INTERNAL_SECRET
      remoteRef: { key: {{ .Values.internal.secretPath | quote }}, property: secret }
    {{- end }}
