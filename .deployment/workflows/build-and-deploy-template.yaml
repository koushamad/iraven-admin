                                  set -e
                                  rm -rf /workspace/* /workspace/.[!.]* /workspace/..?* 2>/dev/null || true
                                  mkdir -p /workspace
                                  echo CLEANUP_OK
                              volumeMounts:
                                - { name: workspace, mountPath: /workspace }
                          volumes:
                            - name: workspace
                              persistentVolumeClaim: { claimName: {{workflow.name}}-pi-arm64-workspace }
                - { name: timeout-seconds, value: "900" }
