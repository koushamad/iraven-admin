            arguments:
              parameters:
                - { name: job-namespace, value: "argo-workflows" }
                - { name: workspace-pvc-name, value: "{{workflow.name}}-pi-arm64-workspace" }
                - { name: workspace-pvc-size, value: "6Gi" }
                - name: job-manifest
                  value: |
                    apiVersion: batch/v1
                    kind: Job
                    metadata:
                      generateName: iraven-web-arm64-cleanup-
                      namespace: argo-workflows
                    spec:
                      backoffLimit: 0
                      ttlSecondsAfterFinished: 300
                      template:
                        spec:
                          automountServiceAccountToken: false
                          restartPolicy: Never
                          containers:
                            - name: cleanup-arm64
                              image: harbor-registry.tail02a6d.ts.net/library/docker:24-dind-arm64
                              command: ["sh","-c"]
                              args:
